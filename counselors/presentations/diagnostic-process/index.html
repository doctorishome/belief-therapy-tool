<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Diagnostic and Coding Procedures (DSM-5-TR) · Belief Counseling</title>
<style>
:root{--navy:#1F3A5F;--gold:#C9A227;--tint:#EEF2F7;--ink:#1F2937;--mut:#6B7280}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,Arial,sans-serif;color:var(--ink);background:#f6f8fb}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-family:Cambria,Georgia,serif;font-size:1.15rem;margin:0}
header a{color:var(--gold);font-weight:bold;text-decoration:none;font-size:.95rem}
main{max-width:1040px;margin:0 auto;padding:14px 12px 30px}
.stage{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(18,40,76,.12);overflow:hidden;touch-action:pan-y}
.stage img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;border-radius:22px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:bold;padding:8px 16px;font-size:1rem}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--navy);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.count{min-width:110px;text-align:center;color:var(--mut);font-size:.95rem}
.tools{display:flex;align-items:center;gap:8px}
.spk{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:22px;height:22px}
.spk[aria-pressed="true"]{background:var(--navy);color:#fff}
.narr{display:none;margin-top:12px;background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 2px 8px rgba(18,40,76,.08);line-height:1.6;font-size:1.05rem}
.narr.on{display:block}
.narr h2{font-size:.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.narr p{margin:0 0 10px}
.narr audio{width:100%;margin-bottom:10px}
.hint{color:var(--mut);font-size:.9rem;margin-top:10px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(15,25,45,.82);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.ov.on{display:flex}
.box{background:#fff;border-radius:10px;max-width:1200px;width:100%;max-height:100%;overflow:auto;padding:12px 14px}
.box .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.box b{color:var(--navy);font-size:1.05rem}
.box .scroll{overflow-x:auto}
.box img{display:block;width:100%;min-width:640px;height:auto}
.box .tip{color:var(--mut);font-size:.85rem;margin-top:6px}
footer{color:var(--mut);font-size:.82rem;text-align:center;padding:10px}
</style></head><body>
<header><h1>Basic Diagnostic and Coding Procedures (DSM-5-TR)</h1>
<a href="https://doctorishome.github.io/belief-therapy-tool/counselors/reviews.html">&#8592; DSM-5-TR Reviews</a></header>
<main>
<div class="stage" id="stage"><img id="slide" alt=""></div>
<div class="bar">
 <div class="nav"><button id="prev" type="button" aria-label="Previous slide">&#9664; Back</button><span class="count" id="count" aria-live="polite"></span><button id="next" class="primary" type="button" aria-label="Next slide">Next &#9654;</button></div>
 <div class="tools">
  <button id="chartBtn" class="gold" type="button">See it on the flow chart</button>
  <button id="spk" class="spk" type="button" aria-pressed="false" aria-label="Narration" title="Narration"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
 </div>
</div>
<div class="narr" id="narr" aria-live="polite"><h2>Narration</h2><div id="narrAudio"></div><div id="narrText"></div></div>
<div class="hint">Use Back and Next, or swipe on a phone. Click the speaker for the narration.</div>
</main>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="box">
 <div class="top"><b id="ovTitle"></b><button id="ovClose" class="primary" type="button">Close &#10005;</button></div>
 <div class="scroll"><img id="ovImg" alt=""></div>
 <div class="tip">On a phone, turn it sideways or slide the chart left and right.</div>
</div></div>
<footer>Educational training for counselors. · © Brian Campbell, Ph.D.</footer>
<script>
const SLIDES = [{"title": "Basic Diagnostic and Coding Procedures", "notes": "Welcome. In this presentation, we'll walk through the basic steps for making a diagnosis with the DSM-5-TR, the current edition of the Diagnostic and Statistical Manual of Mental Disorders, and for writing that diagnosis with the correct codes.\n\nI'm Dr. Brian Campbell. Over many years of teaching and private practice, I've found that a clear, step-by-step process makes diagnosis far less intimidating. So we'll take it one step at a time. There are nine steps in all.\n\nAs we go, I encourage you to keep your own copy of the DSM-5-TR by your side, so you can see where each part of the process is found in the manual.", "img": "slides/slide-01.jpg", "step": 0, "audio": ""}, {"title": "Why diagnostic codes matter", "notes": "Why do diagnostic codes matter? There are three main reasons.\n\nFirst, medical records. A diagnostic code gives the client's record a clear, standard description of the problem that any professional can understand.\n\nSecond, research and statistics. Because everyone uses the same codes, clinics, researchers, and health agencies can count and compare how often different conditions occur.\n\nAnd third, insurance. Medicare, Medicaid, and private insurance companies all use diagnostic codes to decide which services they will pay for. So if your clients use insurance, an accurate code is essential.", "img": "slides/slide-02.jpg", "step": 0, "audio": ""}, {"title": "The coding system behind the DSM-5-TR", "notes": "The codes you'll find in the DSM-5-TR come from a system called the ICD-10-CM. That stands for the International Classification of Diseases, Tenth Revision, Clinical Modification. It's the official code set used for diagnosis and billing in the United States.\n\nYou may hear about ICD-11. The World Health Organization adopted the eleventh revision in 2022. However, the DSM-5-TR hasn't adopted it, and U.S. billing still uses ICD-10-CM. So for now, the codes printed in your DSM-5-TR are the ones you'll use.", "img": "slides/slide-03.jpg", "step": 0, "audio": ""}, {"title": "Working with insurance companies", "notes": "If you plan to work with insurance, here are six practical points to keep in mind.\n\nFirst, insurance companies pay only for certain diagnostic codes. Personality disorders, for example, are often not reimbursed.\n\nSecond, you have a choice about who files the claim. You can give clients a receipt with the diagnostic code and let them submit it themselves, or your office can file the claims for them. Most clients will expect you to offer that service.\n\nThird, to file claims directly, you'll usually apply to join the insurance company's panel of providers. Once accepted, you're an in-network provider. Some companies will also accept claims from out-of-network providers.\n\nFourth, licensed professional counselors can now bill Medicare and Medicaid.\n\nFifth, many insurers require preauthorization before certain services, such as psychological testing. And different services are paid at different rates.\n\nFinally, most insurers require claims to be filed electronically. That means billing software, or a billing company that handles the process for you. Those companies can be helpful, but they can also be expensive.", "img": "slides/slide-04.jpg", "step": 0, "audio": ""}, {"title": "The nine-step diagnostic process", "notes": "Here is the whole process at a glance. There are nine steps.\n\nOne: explore whether the client may have a major mental disorder.\nTwo: check every one of the criteria for the disorder you're considering.\nThree: add any subtypes and specifiers.\nFour: add course and severity, when they apply.\nFive: if the full criteria aren't met, consider an \"other specified\" or \"unspecified\" diagnosis.\nSix: consider a provisional diagnosis when you don't yet have enough information.\nSeven: look for any co-occurring disorders.\nEight: identify other conditions that may need clinical attention, known as Z codes.\nAnd nine: decide which diagnosis is the principal diagnosis, or the reason for the visit.\n\nLet's go through them one at a time.", "img": "slides/slide-05.jpg", "step": 0, "audio": ""}, {"title": "The diagnostic flow chart", "notes": "Before we look at each step in detail, here is the flow chart I use to picture the whole process. You may find it helpful to come back to this chart as we go, and follow along. The small numbered tags on the boxes show which of the nine steps each box belongs to.\n\nWe begin at Start, by checking everything we know about the client: the clinical records, the client's history, the reason for referral, the initial interview, and any previous or current test results.\n\nFrom there, we consider whether the client may have a major mental disorder, and whether there may be a co-occurring diagnosis as well.\n\nNext, we check the criteria. Then we come to the key decision point, the black diamond: does the client meet all of the criteria?\n\nIf the answer is yes, we follow the path upward and consider all the subtypes and specifiers, including course and severity.\n\nIf the answer is no, we follow the path downward and consider an unspecified, other specified, or provisional diagnosis.\n\nBoth paths then lead to the same place: considering other conditions that may be a focus of clinical attention, the Z codes. And finally, we determine the principal diagnosis or reason for visit, and we've reached the end.\n\nNow let's walk through each of these steps, one at a time.", "img": "slides/slide-06.jpg", "step": 0, "audio": ""}, {"title": "Step 1 · Explore for a major mental disorder", "notes": "Step one is to explore the possibility that the client has a major mental disorder.\n\nBefore you decide anything, gather all the information available to you. That includes the client's background information and history, the reason the client was referred, what you learned in the initial interview, and any test results, both from earlier testing and from testing you've done yourself.\n\nTaken together, these sources point you toward the disorder or disorders you need to consider.", "img": "slides/slide-07.jpg", "step": 1, "audio": ""}, {"title": "Step 2 · Check every criterion", "notes": "Step two is the heart of the process: check the criteria.\n\nTo diagnose a major mental disorder, you must confirm that the client meets every criterion the DSM-5-TR lists for that disorder. Most disorders have several criteria, so take your time and go through each one.\n\nAs you do, you may find you need more information. You might go back to the client's background, the test data, or your clinical records. Or you may need to ask the client further questions about a particular criterion.\n\nDon't skip ahead. If you're unsure whether a criterion is met, find out before you make the diagnosis.", "img": "slides/slide-08.jpg", "step": 2, "audio": ""}, {"title": "Step 3 · Add subtypes and specifiers", "notes": "Step three: once you've confirmed that all the criteria are met, add any subtypes and specifiers listed for that disorder.\n\nHere's how to recognize them in the manual. Subtypes are marked in the criteria by the instruction \"specify whether.\" Specifiers are marked by \"specify\" or \"specify if.\" A disorder can have more than one specifier, so be sure to consider every one that's listed.\n\nHere's an example. F43.10, posttraumatic stress disorder, with dissociative symptoms, with delayed expression. In this example, \"with dissociative symptoms\" is the subtype, and \"with delayed expression\" is the specifier.", "img": "slides/slide-09.jpg", "step": 3, "audio": ""}, {"title": "Step 4 · Add course and severity", "notes": "Step four: when they apply, add course and severity specifiers.\n\nThe course describes how the disorder has unfolded over time. For example, persistent, in partial remission, or in full remission. The severity describes how intense it is right now, such as mild, moderate, severe, or extreme. Not every disorder has these options, so check the manual.\n\nThese are listed after the name of the disorder. For example: F94.2, disinhibited social engagement disorder, persistent, severe. \"Persistent\" is the course, and \"severe\" is the severity.\n\nOne important caution. Use course and severity only when the full criteria are met. If your diagnosis is provisional, leave them off, even if the manual offers them for that disorder.", "img": "slides/slide-10.jpg", "step": 4, "audio": ""}, {"title": "Step 5 · Other specified or unspecified", "notes": "Step five: what if the client clearly has a significant problem, but doesn't meet the full criteria for any specific disorder? Then you consider an \"unspecified\" or an \"other specified\" diagnosis.\n\nUse \"unspecified\" when the client looks as though they have a disorder in that category but doesn't technically meet all the criteria, and you choose not to say why. For example: F44.9, unspecified dissociative disorder.\n\nUse \"other specified\" when you know the reason the criteria aren't met, and you choose to state it. You record the name of the category, followed by the reason. For example, a client with significant depressive symptoms for four weeks, but with too few symptoms for a major depressive episode, would be recorded as F32.89, other specified depressive disorder, depressive episode with insufficient symptoms.", "img": "slides/slide-11.jpg", "step": 5, "audio": ""}, {"title": "Remembering the difference: the duck analogy", "notes": "Here's a simple way I like to remember the difference. Picture a duck.\n\nIt looks like a duck in every way. But it doesn't have webbed feet, and webbed feet are one of the criteria for calling something a duck. So technically, it doesn't meet the criteria.\n\nIf I use the \"unspecified\" label, I don't mention the feet at all. I simply call it \"duck, unspecified.\" It looks like a duck, but it doesn't meet every criterion, and I'm not saying why.\n\nIf I use the \"other specified\" label, I state the reason. I call it \"other specified duck, duck without webbed feet.\"\n\nSo: unspecified means you don't give the reason, and other specified means you do.", "img": "slides/slide-12.jpg", "step": 5, "audio": ""}, {"title": "Step 6 · Consider a provisional diagnosis", "notes": "Step six: consider a provisional diagnosis. This is how you express diagnostic uncertainty.\n\nYou place the word \"provisional\" in parentheses after the diagnosis in three situations.\n\nFirst, when you don't yet have enough information to make a firm diagnosis, but it looks like the disorder, and you believe more information would confirm it.\n\nSecond, when the client can't give an adequate history, but you believe the criteria would be met if that history were available.\n\nAnd third, when the diagnosis depends on how long a symptom has lasted, and you don't yet know whether it has lasted long enough.\n\nFor example: F44.81, dissociative identity disorder, provisional. And remember from step four: don't add course or severity to a provisional diagnosis.", "img": "slides/slide-13.jpg", "step": 6, "audio": ""}, {"title": "Step 7 · Look for co-occurring disorders", "notes": "Step seven: look for co-occurring disorders, also called comorbid diagnoses.\n\nClients often have more than one major mental disorder. When you suspect another one, put it through the same steps we've just covered. Check it against its own criteria, then add any subtypes, specifiers, course, and severity that apply.\n\nEach additional disorder you confirm becomes part of the diagnosis and will shape your treatment plan.", "img": "slides/slide-14.jpg", "step": 7, "audio": ""}, {"title": "Step 8 · Identify other conditions (Z codes)", "notes": "Step eight: identify other conditions that may be a focus of clinical attention. These are coded with Z codes.\n\nZ codes are not mental disorders. They describe psychosocial and environmental problems that affect a person's diagnosis, course, prognosis, or treatment. You can use them alongside a mental disorder, or on their own when no disorder is diagnosed.\n\nUse a Z code when the problem is a reason for the current visit, when it explains the need for a test, procedure, or treatment, when it helped start or worsen a mental disorder, or when it should be considered in the overall treatment plan.\n\nThe DSM-5-TR groups them into categories, such as relational problems, abuse and neglect, and educational, occupational, housing, and economic problems. Others cover the social environment, the legal system, access to health care, and personal history. There are also codes for suicidal behavior and nonsuicidal self-injury. You'll find them in the chapter called \"Other Conditions That May Be a Focus of Clinical Attention.\"\n\nA practical tip: limit yourself to one to four Z codes. Use more than that, and they start to lose their meaning. If you list more than one, put the most important first.", "img": "slides/slide-15.jpg", "step": 8, "audio": ""}, {"title": "Step 9 · Choose the principal diagnosis", "notes": "Step nine: decide which diagnosis comes first. What you call it depends on the setting.\n\nIn a hospital, or inpatient, setting, it's the principal diagnosis: the condition that was chiefly responsible for the client being admitted.\n\nIn an outpatient setting, it's the reason for visit: the condition chiefly responsible for the services you're providing. In most cases, it's also the main focus of treatment. Sometimes the choice is difficult, for example when a substance use disorder occurs together with another serious disorder. Use your best clinical judgment.\n\nList that diagnosis first, and then list the others in order of their focus in treatment. You can add \"(principal diagnosis)\" or \"(reason for visit)\" after it to make it clear.\n\nOne exception: when a mental disorder is caused by a medical condition, coding rules require the medical condition to be listed first, with the mental disorder that results from it listed next.\n\nAnd if no mental disorder is diagnosed, a Z code can be listed first as the principal diagnosis or reason for visit.", "img": "slides/slide-16.jpg", "step": 9, "audio": ""}, {"title": "Writing the diagnosis clearly", "notes": "The DSM-5-TR doesn't spell out exactly how to write a diagnosis, so here are the formats I recommend for clarity.\n\nStart with the code, followed by the name of the disorder. Place the severity immediately after the name of the disorder. That avoids confusion, even though the manual lists severity last. Capitalize only the first word of the diagnosis, in keeping with APA style, and write the specifiers in lowercase. And when there's more than one diagnosis, mark which one is the principal diagnosis or the reason for visit.\n\nHere's what a complete outpatient diagnosis might look like.\nF41.1, generalized anxiety disorder, reason for visit.\nF81.0, specific learning disorder, mild, with impairment in reading.\nZ62.820, parent-child relational problem, parent-biological child.\nAnd Z63.0, relationship distress with spouse or intimate partner.\n\nNotice the order: the reason for visit comes first, then the other mental disorder, and then the Z codes.", "img": "slides/slide-17.jpg", "step": 0, "audio": ""}, {"title": "Three examples", "notes": "Let's look at three more examples.\n\nIn the first, the client has a single disorder: F32.0, major depressive disorder, single episode, mild, with anxious distress. With only one disorder, it's assumed to be the principal diagnosis, so you don't need to label it.\n\nIn the second, the client has two mental disorders and one Z code. Generalized anxiety disorder is listed first as the principal diagnosis, followed by the specific learning disorder, and then the Z code, problems related to unwanted pregnancy. Notice there are no specifiers for generalized anxiety disorder.\n\nIn the third, the client has no major mental disorder, but two Z codes apply. The parent-child relational problem is listed first as the principal diagnosis, followed by problems related to unwanted pregnancy.", "img": "slides/slide-18.jpg", "step": 0, "audio": ""}, {"title": "Nine steps, one careful process", "notes": "Let's pull it all together.\n\nDiagnosis with the DSM-5-TR is one careful process. First, gather everything you know about the client. Then check every criterion for the disorder you're considering. Add the subtypes, specifiers, course, and severity that apply. If the full picture isn't clear, use an other specified, unspecified, or provisional diagnosis to express that uncertainty honestly. Look for co-occurring disorders and the Z codes that matter. And finally, put everything in the right order, with the principal diagnosis or reason for visit first.\n\nAn accurate diagnosis is the foundation for a good treatment plan. So keep your DSM-5-TR by your side, and take it one step at a time. Thank you.", "img": "slides/slide-19.jpg", "step": 0, "audio": ""}];
const STEP_NAMES = {1:"Explore for a major mental disorder",2:"Check every criterion",3:"Add subtypes and specifiers",4:"Add course and severity",5:"Other specified or unspecified",6:"Consider a provisional diagnosis",7:"Look for co-occurring disorders",8:"Identify other conditions (Z codes)",9:"Choose the principal diagnosis"};
let i = 0, narrOn = false;
const STEP_X = {1:220,2:760,3:900,4:900,5:900,6:900,7:445,8:1210,9:1490};
const $ = id => document.getElementById(id);
function esc(t){return t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function show(n){
  i = Math.max(0, Math.min(SLIDES.length-1, n));
  const s = SLIDES[i];
  $("slide").src = s.img; $("slide").alt = "Slide " + (i+1) + ": " + s.title;
  $("count").textContent = "Slide " + (i+1) + " of " + SLIDES.length;
  $("prev").disabled = i === 0; $("next").disabled = i === SLIDES.length-1;
  $("chartBtn").style.display = s.step ? "" : "none";
  renderNarr(false);
  history.replaceState(null, "", "#" + (i+1));
  [i-1,i+1].forEach(k=>{ if(SLIDES[k]){ const im=new Image(); im.src=SLIDES[k].img; }});
}
function renderNarr(play){
  const s = SLIDES[i];
  $("narrText").innerHTML = s.notes.split(/\n\s*\n/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
  $("narrAudio").innerHTML = s.audio ? '<audio controls preload="none" src="'+s.audio+'"></audio>' : "";
  if (play && s.audio) { const a = $("narrAudio").querySelector("audio"); if (a) a.play().catch(()=>{}); }
}
$("prev").onclick = () => show(i-1);
$("next").onclick = () => show(i+1);
$("spk").onclick = () => {
  narrOn = !narrOn;
  $("narr").classList.toggle("on", narrOn);
  $("spk").setAttribute("aria-pressed", narrOn);
  if (narrOn) { renderNarr(true); } else { const a = $("narrAudio").querySelector("audio"); if (a) a.pause(); }
};
function openChart(){
  const k = SLIDES[i].step; if (!k) return;
  $("ovTitle").textContent = "Step " + k + " on the flow chart: " + STEP_NAMES[k];
  $("ovImg").src = "charts/step" + k + ".png";
  $("ovImg").alt = "The diagnostic flow chart with step " + k + " highlighted.";
  $("ov").classList.add("on"); $("ovClose").focus();
  const sc = document.querySelector(".box .scroll");
  const fit = () => { const f = STEP_X[k] / 1620; sc.scrollLeft = Math.max(0, f * sc.scrollWidth - sc.clientWidth / 2); };
  if ($("ovImg").complete) fit(); $("ovImg").onload = fit;
}
function closeChart(){ $("ov").classList.remove("on"); $("chartBtn").focus(); }
$("chartBtn").onclick = openChart;
$("ovClose").onclick = closeChart;
$("ov").onclick = e => { if (e.target === $("ov")) closeChart(); };
document.addEventListener("keydown", e => {
  if ($("ov").classList.contains("on")) { if (e.key === "Escape") closeChart(); return; }
  if (e.key === "ArrowRight") show(i+1);
  if (e.key === "ArrowLeft") show(i-1);
});
let x0 = null;
$("stage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
$("stage").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
window.addEventListener("hashchange", () => { const n = (parseInt(location.hash.slice(1), 10) || 1) - 1; if (n !== i) show(n); });
</script>
</body></html>
