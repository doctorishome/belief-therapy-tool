<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belief Mining Tools</title>
<!--
  Bottom of each Belief Mining level page on the Wix site:
  the worksheet cards ("Belief Mining Tools") and the dark Back / Forward bar.

  Each Wix level page shows this file in an "Embed a site" box, with ?level=... at the end:
    Biological/Physical      ...tools.html?level=bio
    Psychological/Cognitive  ...tools.html?level=psych
    Interpersonal            ...tools.html?level=inter
    Socioeconomic            ...tools.html?level=socioeconomic
    Sociocultural            ...tools.html?level=sociocultural
    Spiritual/Religious      ...tools.html?level=spiritual

  TO CHANGE WORDING, WORKSHEETS, OR WHERE THE BUTTONS GO: edit the LEVELS list below,
  then commit and push. The Wix pages update by themselves (no Wix editing or Publish).
  Links that start with "/" are pages of the Wix site; they open in the same window.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: Georgia, "Times New Roman", serif; color: #2D2A26; padding: 2px 4px 6px; }
  .sub { text-align: center; color: #796E5E; font-size: 16px; margin: 0 0 10px; }
  .rule { width: 80px; border-top: 2px solid #B08A4B; margin: 0 auto 18px; }
  .intro { max-width: 820px; margin: 0 auto 16px; text-align: center; font-size: 15px; line-height: 1.55; color: #4a453d; }
  .list { max-width: 820px; margin: 0 auto; border: 1px solid #D8CDBB; border-radius: 10px; background: #FFFDF8; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-top: 1px solid #EDE4D3; }
  .row:first-child { border-top: none; }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #F3E9D2; color: #665A49; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .txt { flex: 1; }
  .txt b { display: block; font-size: 18px; margin-bottom: 3px; }
  .txt span { font-size: 15px; color: #5E554A; line-height: 1.45; }
  .btn { flex: none; font-family: Georgia, serif; font-size: 15px; color: #3a3a3a; background: #fff; border: 1px solid #665A49; border-radius: 4px; padding: 9px 16px; text-decoration: none; white-space: nowrap; }
  .btn:hover, .btn:focus-visible { background: #F3E9D2; outline: none; }
  .soon { max-width: 820px; margin: 0 auto; text-align: center; font-style: italic; color: #796E5E; font-size: 15px; padding: 14px; border: 1px dashed #D8CDBB; border-radius: 10px; background: #FFFDF8; }

  /* Back / Forward bar */
  .next { max-width: 1040px; margin: 34px auto 0; background: #1b2a41; border-radius: 12px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
          font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .back { color: #fff; font-size: 17px; font-weight: 700; text-decoration: none; }
  .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
  .go { flex: none; background: #d9b45a; color: #1b2a41; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 12px 22px; white-space: nowrap; text-decoration: none; transition: background .15s ease; }
  .go:hover, .go:focus-visible { background: #e8c873; outline: none; }

  @media (max-width: 600px) {
    .row { flex-wrap: wrap; padding: 14px; }
    .txt { flex-basis: calc(100% - 52px); }
    .btn { margin-left: 50px; }
    .next { flex-direction: column; align-items: flex-start; padding: 16px; }
    .go { white-space: normal; }
  }
</style>
</head>
<body>
  <div id="app"></div>
<script>
  var SITE = "https://doctorishome.wixstudio.com/website-6";
  var GH = "https://doctorishome.github.io/belief-therapy-tool/";

  // ===== EDIT THE SIX LEVELS HERE =====
  var LEVELS = {
    bio: {
      tools: [
        { title: "Life Events & Beliefs Screening",
          text: "A one-page checklist of illnesses, injuries, medications, and other life events that may lie beneath painful beliefs.",
          link: GH + "Life_Events_Beliefs_Screening.html" }
      ],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #1 Mining Results →", path: "/biological-physical-false-beliefs" }
    },
    psych: {
      tools: [],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #2 Mining Results →", path: "/blank-7" }
    },
    inter: {
      tools: [
        { title: "Toxic Beliefs Parents Teach Children",
          text: "A checklist of messages received from parents or caretakers while growing up, and what they taught you to believe.",
          link: GH + "worksheets/parents.html" },
        { title: "Toxic Messages from Media & Culture",
          text: "A checklist of messages absorbed from TV, movies, music, advertising, and social media.",
          link: GH + "worksheets/media.html" },
        { title: "Toxic Messages from Spouses or Partners",
          text: "A checklist of hurtful messages received from a spouse or partner, in words or through actions.",
          link: GH + "worksheets/partners.html" },
        { title: "Toxic Messages from Church & Religion",
          text: "A checklist of messages taught, directly or indirectly, in a church or religious setting.",
          link: GH + "worksheets/church-setting.html" }
      ],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #3 Mining Results →", path: "/blank-8" }
    },
    socioeconomic: {
      tools: [
        { title: "Toxic Messages from Money, Work & Status",
          text: "A checklist of messages learned from finances, work, or your family’s circumstances.",
          link: GH + "worksheets/money.html" }
      ],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #4 Mining Results →", path: "/blank-9" }
    },
    sociocultural: {
      tools: [],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #5 Mining Results →", path: "/blank-10" }
    },
    spiritual: {
      tools: [
        { title: "Toxic Messages from Church & Religion",
          text: "A checklist of messages learned from church, religious teaching, or your spiritual upbringing.",
          link: GH + "worksheets/church-upbringing.html" }
      ],
      back:    { label: "← Back to Belief Mining", path: "/belief-mining" },
      forward: { label: "Forward to Level #6 Mining Results →", path: "/spiritual-religious-false-beliefs" }
    }
  };
  // =====================================

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function href(p) { return p.charAt(0) === "/" ? SITE + p : p; }

  var key = (new URLSearchParams(location.search).get("level") || "bio").toLowerCase();
  var L = LEVELS[key] || LEVELS.bio;

  var h = "";
  if (L.tools.length) {
    h += '<p class="sub">Printable worksheet' + (L.tools.length > 1 ? "s" : "") + ' for this level</p><div class="rule"></div>';
    if (L.intro) h += '<p class="intro">' + esc(L.intro) + "</p>";
    h += '<div class="list">' + L.tools.map(function (t, i) {
      return '<div class="row"><div class="num">' + (i + 1) + '</div><div class="txt"><b>' + esc(t.title) + "</b><span>" + esc(t.text) +
        '</span></div><a class="btn" href="' + esc(t.link) + '" target="_blank" rel="noopener" aria-label="Open the ' + esc(t.title) + ' form">Open Form</a></div>';
    }).join("") + "</div>";
  } else {
    h += '<p class="sub">Printable worksheets for this level</p><div class="rule"></div><div class="soon">Worksheets for this level are coming soon.</div>';
  }
  h += '<div class="next">' +
       '<a class="back" href="' + esc(href(L.back.path)) + '" data-path="' + esc(L.back.path) + '">' + esc(L.back.label) + "</a>" +
       '<a class="go" href="' + esc(href(L.forward.path)) + '" data-path="' + esc(L.forward.path) + '">' + esc(L.forward.label) + "</a></div>";
  document.getElementById("app").innerHTML = h;

  // Site pages open in the same window: the Wix page code does the move (see level-pages/wix-page-code.js).
  // If no page code is listening, the link opens in a new tab instead, so it always works.
  document.querySelectorAll("a[data-path]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      var p = a.getAttribute("data-path");
      if (p.charAt(0) !== "/") return;
      e.preventDefault();
      var done = false;
      function onAck(ev) { if (ev.data && ev.data.type === "navigate-ok") done = true; }
      window.addEventListener("message", onAck);
      window.parent.postMessage({ type: "navigate", path: p }, "*");
      setTimeout(function () { window.removeEventListener("message", onAck); if (!done) window.open(href(p), "_blank"); }, 700);
    });
  });
</script>
</body>
</html>
